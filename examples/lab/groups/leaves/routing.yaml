# Redistribute loopbacks, and only loopbacks, into BGP.
routing-policy:
  defined-sets:
    prefix-sets:
      prefix-set:
        - name: LOOPBACKS
          config:
            name: LOOPBACKS
            mode: IPV4
          prefixes:
            prefix:
              - ip-prefix: 10.0.0.0/24
                masklength-range: "32..32"
                config:
                  ip-prefix: 10.0.0.0/24
                  masklength-range: "32..32"
  policy-definitions:
    policy-definition:
      - name: CONNECTED-TO-BGP
        config:
          name: CONNECTED-TO-BGP
        statements:
          statement:
            - name: loopbacks
              config:
                name: loopbacks
              conditions:
                match-prefix-set:
                  config:
                    prefix-set: LOOPBACKS
              actions:
                config:
                  policy-result: ACCEPT_ROUTE
            - name: everything-else
              config:
                name: everything-else
              actions:
                config:
                  policy-result: REJECT_ROUTE

network-instances:
  network-instance:
    - name: default
      table-connections:
        table-connection:
          - src-protocol: openconfig-policy-types:DIRECTLY_CONNECTED
            dst-protocol: openconfig-policy-types:BGP
            address-family: openconfig-types:IPV4
            config:
              src-protocol: openconfig-policy-types:DIRECTLY_CONNECTED
              dst-protocol: openconfig-policy-types:BGP
              address-family: openconfig-types:IPV4
              import-policy: [CONNECTED-TO-BGP]
