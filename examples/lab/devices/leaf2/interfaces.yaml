interfaces:
  interface:
    - name: Ethernet1
      config:
        name: Ethernet1
        type: iana-if-type:ethernetCsmacd
        description: leaf1:Ethernet1
        enabled: true
        mtu: 9214
      subinterfaces:
        subinterface:
          - index: 0
            config:
              index: 0
            ipv4:
              addresses:
                address:
                  - ip: 10.10.10.2
                    config:
                      ip: 10.10.10.2
                      prefix-length: 30
    - name: Loopback0
      config:
        name: Loopback0
        type: iana-if-type:softwareLoopback
        description: router-id
        enabled: true
      subinterfaces:
        subinterface:
          - index: 0
            config:
              index: 0
            ipv4:
              addresses:
                address:
                  - ip: 10.0.0.2
                    config:
                      ip: 10.0.0.2
                      prefix-length: 32
